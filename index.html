<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қонаев хронологиясы</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
/* Look: flat 1970s poster illustration. Paper #F4F1EA, ink #17212B, red #D2402F, ochre #E4A93B, teal #2B7A78. */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{gap:12px}}
.card:focus-visible,.btn:focus-visible{outline:3px solid #2F4CDD;outline-offset:3px}
.btn:hover{transform:translate(-1px,-1px)}
@keyframes wave{0%,100%{transform:translateY(calc(var(--amp) * -1))}50%{transform:translateY(var(--amp))}}
.strip{animation:wave 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.pen{transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-5deg)}50%{transform:translate(-22px,12px) rotate(-3deg)}}
.bgflag{animation:drift 14s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.hand{transform-origin:50% 100%;animation:bob 0.9s ease-in-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:0.8}100%{transform:scale(3.6);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
@keyframes cardpop{0%{scale:1}40%{scale:1.09;rotate:-2deg}70%{scale:.98;rotate:1deg}100%{scale:1;rotate:0deg}}
@keyframes cardshake{0%,100%{translate:0 0}20%{translate:-9px 0}40%{translate:8px 0}60%{translate:-6px 0}80%{translate:4px 0}}
@keyframes stamp{0%{transform:scale(3) rotate(-10deg);opacity:0}60%{transform:scale(.92) rotate(-3deg);opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.stamp{display:inline-block;animation:stamp .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}
.cf{position:absolute;left:50%;top:50%;width:12px;height:18px;opacity:0;animation:burst 1.5s cubic-bezier(.15,.8,.3,1) both}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:1}100%{transform:translate(var(--sx),1200px) rotate(var(--rot));opacity:1}}
.fall{position:absolute;top:0;width:12px;height:18px;animation:fall 5s linear infinite}
@keyframes spark{0%{transform:rotate(var(--a)) translateX(0) scale(1);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(130px) scale(.3);opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:spark 1.8s ease-out infinite}
@keyframes rain{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(190px);opacity:0}}
.drop{position:absolute;width:3px;height:16px;border-radius:2px;background:#7FB8DA;animation:rain 1.1s linear infinite}
@keyframes cloudbob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(12px) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scorepop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.pen,.hand{animation:none}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">


<div style="position: relative; overflow: hidden; min-height: 1080px; box-sizing: border-box; background: #F4F1EA; color: #17212B; font-family: 'Golos Text', system-ui, sans-serif; padding: 84px 56px 72px;">
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 66px; pointer-events: none; z-index: 1;">
<div style="position: absolute; top: 10px; left: 0; right: 0; height: 3px; background: #17212B;"></div>
<div style="position: absolute; top: 13px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px;">
<sc-for list="{{ pennants }}" as="p">
<div class="pen" style="width: 38px; height: 46px; background: {{ p.bg }}; clip-path: polygon(0 0, 100% 0, 50% 100%); animation-delay: {{ p.delay }};"></div>
</sc-for>
</div>
</div>
<sc-if value="{{ final5 }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 3;">
<sc-for list="{{ rain }}" as="r">
<span class="fall" style="left: {{ r.left }}; background: {{ r.bg }}; --sx: {{ r.sx }}; --rot: {{ r.rot }}; animation-duration: {{ r.dur }}; animation-delay: {{ r.delay }};"></span>
</sc-for>
<sc-for list="{{ sparks }}" as="f">
<div style="position: absolute; left: {{ f.x }}; top: {{ f.y }}; width: 0; height: 0;">
<span class="spark" style="background: {{ f.bg }}; --a: {{ f.a }}; animation-delay: {{ f.delay }};"></span>
</div>
</sc-for>
</div>
</sc-if>
<div style="position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; padding-bottom: 18px; border-bottom: 3px solid #17212B;">
<div style="display: flex; align-items: flex-end; gap: 18px;">

<div data-slot style="display: flex; flex: 1; padding: 6px; border: 2px dashed {{ s.zoneBorder }}; background: {{ s.zoneBg }};">

<span style="display: flex; flex-direction: column; gap: 8px;">
<span style="align-self: flex-start; padding: 3px 10px; background: {{ s.statusBg }}; color: #F4F1EA; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">{{ s.status }}</span>
<span style="display: block; font-size: 15px; line-height: 1.4; color: #3B4650;">{{ s.fact }}</span>
</span>
</sc-if>
</span>

</button>
</div>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; min-height: 64px;">
<sc-if value="{{ showCheck }}">
<button class="btn" type="button" onClick="{{ check }}" style="padding: 16px 34px; background: #17212B; color: #F4F1EA; border: 2px solid #17212B; box-shadow: 5px 5px 0 #D2402F; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;">Ретін тексеру</button>
</sc-if>
<sc-if value="{{ showNext }}">
<button class="btn" type="button" onClick="{{ next }}" style="padding: 16px 34px; background: #17212B; color: #F4F1EA; border: 2px solid #17212B; box-shadow: 5px 5px 0 #D2402F; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;">{{ nextLabel }}</button>
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; color: {{ verdictColor }};" class="stamp">{{ verdict }}</span>
</sc-if>
</div>

<p style="margin: 8px 0 0; padding-top: 16px; border-top: 2px solid #17212B; font-size: 17px; line-height: 1.45; color: #3B4650; max-width: 72ch;">Карточканы алып, керекті орынға апарыңыз: ең ерте оқиға сол жақта, ең кейінгісі оң жақта болсын. Пернетақтадағы көрсеткілер де жұмыс істейді.</p>

</section>
</sc-if>

<sc-if value="{{ isFinal }}">
<section style="display: flex; flex-direction: column; gap: 24px; padding: 24px 0 8px;">
<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #3B4650;">Ойын аяқталды</span>
<div style="position: relative; display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; padding: 24px 0;">
<sc-if value="{{ final5 }}">
<div style="position: absolute; left: -60px; top: 50%; width: 520px; height: 520px; margin-top: -260px; border-radius: 50%; z-index: 0; pointer-events: none; opacity: 0.35; background: repeating-conic-gradient(from 0deg, #E4A93B 0deg 10deg, transparent 10deg 20deg); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 70%); mask-image: radial-gradient(circle, #000 20%, transparent 70%); animation: spin 18s linear infinite;"></div>
</sc-if>
<span style="position: relative; z-index: 1; display: inline-block; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(120px, 24vw, 280px); line-height: 0.9; color: {{ finalColor }}; animation: {{ finalAnim }};">{{ finalScore }}</span>
<span style="position: relative; z-index: 1; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: clamp(32px, 5vw, 56px); text-transform: uppercase;">/ {{ roundsTotal }}</span>
</div>
<p style="margin: 0; font-size: 22px; line-height: 1.45; max-width: 46ch; color: #3B4650;">{{ finalText }}</p>
<div>
<button class="btn" type="button" onClick="{{ again }}" style="padding: 16px 34px; background: #17212B; color: #F4F1EA; border: 2px solid #17212B; box-shadow: 5px 5px 0 #D2402F; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;">Қайта ойнау</button>
</div>
</section>
</sc-if>

</div>
</div>
</template>
<script>

class DCLogic{
  constructor(props){this.props=props||{};this.state={};}
  setState(p){Object.assign(this.state,typeof p==='function'?p(this.state):p);window.__render&&window.__render();}
}


class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.freshGame();
  }

  events() {
    return [
      { year: 1936, title: "Балқаш маңындағы кеніште жұмыс бастауы", fact: "Түсті металдар және алтын институтын бітіргеннен кейін Қонаев тау-кен инженері болып жұмысын бастады." },
      { year: 1952, title: "Республика Ғылым академиясының басшысы", fact: "Тау-кен инженері Қазақ КСР Ғылым академиясының президенті болды." },
      { year: 1960, title: "Қазақстан Компартиясы ОК-нің бірінші хатшысы болып сайланды", fact: "Алғаш рет республиканы басқарды." },
      { year: 1961, title: "Байқоңырдан адамның ғарышқа алғашқы ұшуы", fact: "Адамның ғарышқа алғашқы ұшуы Қазақстаннан басталды." },
      { year: 1972, title: "Социалистік Еңбек Ері атағын алғаш рет алды", fact: "Барлығы ол бұл атақты үш рет алды: 1972, 1976 және 1982 жылдары." },
      { year: 1973, title: "Бөгет Алматыны селден сақтап қалды", fact: "Медеу бөгеті қаланы қиратушы сел ағынынан қорғады." },
      { year: 1983, title: "Көктөбедегі телемұнара", fact: "Алматыда жаңа телемұнараның құрылысы аяқталды." },
      { year: 1986, title: "Қонаевтың отставкаға кетуі және Желтоқсан оқиғасы", fact: "Басшылыққа Геннадий Колбин тағайындалды, бұл Желтоқсан наразылығына әкелді." },
      { year: 1988, title: "Алматыда метро құрылысының басталуы", fact: "Құрылыс 1988 жылы басталды, алғашқы желі 2011 жылы ашылды." }
    ];
  }

  shuffled(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  freshRound() {
    const ev = this.events();
    const idx = this.shuffled(ev.map((e, i) => i)).slice(0, 4);
    const sorted = idx.slice().sort((a, b) => ev[a].year - ev[b].year);
    let order = this.shuffled(idx), g = 0;
    while (g++ < 30 && order.every((v, i) => v === sorted[i])) order = this.shuffled(idx);
    return { order: order, sorted: sorted, guess: [], checked: false, hits: 0, drag: null };
  }

  freshGame() {
    return Object.assign({ round: 0, score: 0, phase: "play" }, this.freshRound());
  }

  componentDidMount() {
    this.startTrains();
  }

  componentWillUnmount() {
    this.unbind();
    this.stopTrains();
  }

  startTrains() {
    this.stopTrains();
    this._routes = {};
    const t0 = Date.now();
    const tick = () => {
      const t = (Date.now() - t0) / 1000;
      const els = document.querySelectorAll("g.train");
      for (let n = 0; n < els.length; n++) this.moveTrain(els[n], t);
      this.moveRocket(t);
      this._raf = window.requestAnimationFrame(tick);
    };
    this._raf = window.requestAnimationFrame(tick);
  }

  stopTrains() {
    if (this._raf) window.cancelAnimationFrame(this._raf);
    this._raf = null;
  }

  moveRocket(t) {
    const r = document.querySelector("g.rocket");
    if (!r) return;
    const puffs = document.querySelector("g.puffs");
    const trail = r.querySelector("path.trail");
    const T = 26;           // one full cycle, seconds
    const hold = 4;         // seconds on the pad
    const fly = 19;         // seconds of climb
    const c = t % T;
    let x = 0, y = 0, ang = 0, sc = 1, op = 1, tl = 16 + 5 * Math.sin(t * 14);
    if (c >= hold && c < hold + fly) {
      const s = (c - hold) / fly;        // 0..1
      const p = s * s;                   // slow start, gradual speed-up
      x = 70 * p; y = -420 * p;
      ang = Math.atan2(70, 420) * 180 / Math.PI;
      sc = 1 - 0.5 * p;
      op = p > 0.8 ? Math.max(0, (1 - p) / 0.2) : 1;
      tl = 22 + 120 * p + 4 * Math.sin(t * 14);
    } else if (c >= hold + fly) {
      op = 0;
    }
    r.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ") scale(" + sc.toFixed(3) + ")");
    r.setAttribute("opacity", op.toFixed(2));
    if (trail) trail.setAttribute("d", "M-3.4 4 L0 " + tl.toFixed(1) + " L3.4 4Z");
    if (puffs) {
      // exhaust cloud on the pad: grows and fades while the rocket lifts off
      const q = (c - (hold - 1)) / 9;
      const o = q > 0 && q < 1 ? Math.sin(q * Math.PI) * 0.9 : 0;
      const k = 0.6 + 1.6 * Math.max(0, Math.min(1, q));
      puffs.setAttribute("opacity", o.toFixed(2));
      puffs.setAttribute("transform", "translate(0 8) scale(" + k.toFixed(2) + ") translate(0 -8)");
    }
  }

  moveTrain(el, t) {
    const key = el.getAttribute("data-route");
    if (!key) return;
    let r = this._routes[key];
    if (!r) {
      const pts = key.split(" ").map((q) => { const a = q.split(","); return [parseFloat(a[0]), parseFloat(a[1])]; });
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      r = this._routes[key] = { pts: pts, cum: cum, total: cum[cum.length - 1] };
    }
    const dur = parseFloat(el.getAttribute("data-dur")) || 16;
    const phase = parseFloat(el.getAttribute("data-phase")) || 0;
    const u = (((t + phase) % dur) + dur) % dur / dur;
    const dist = u * r.total;
    let i = 1;
    while (i < r.cum.length - 1 && r.cum[i] < dist) i++;
    const seg = r.cum[i] - r.cum[i - 1] || 1;
    const f = Math.min(1, Math.max(0, (dist - r.cum[i - 1]) / seg));
    const a = r.pts[i - 1], b = r.pts[i];
    const x = a[0] + (b[0] - a[0]) * f;
    const y = a[1] + (b[1] - a[1]) * f;
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const flip = Math.cos(ang) < 0 ? -1 : 1;
    el.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + (ang * 180 / Math.PI).toFixed(1) + ") scale(1 " + flip + ")");
    el.setAttribute("opacity", Math.min(1, u / 0.05, (1 - u) / 0.05).toFixed(2));
  }

  unbind() {
    if (this._mv) window.removeEventListener("pointermove", this._mv);
    if (this._up) {
      window.removeEventListener("pointerup", this._up);
      window.removeEventListener("pointercancel", this._up);
    }
    this._mv = null; this._up = null;
  }

  startDrag(e, k) {
    if (this.state.checked || this._dragging) return;
    const board = e.currentTarget && e.currentTarget.closest("[data-board]");
    if (!board) return;
    this._slots = Array.from(board.querySelectorAll("[data-slot]")).map((s) => {
      const r = s.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
    if (e.preventDefault) e.preventDefault();
    this._dragging = true;
    this._di = k;
    this._tgt = k;
    this._mv = (ev) => this.moveDrag(ev);
    this._up = () => this.endDrag();
    window.addEventListener("pointermove", this._mv);
    window.addEventListener("pointerup", this._up);
    window.addEventListener("pointercancel", this._up);
    this.setState({ drag: { i: k, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, target: k } });
  }

  moveDrag(ev) {
    if (!this._dragging) return;
    let best = this._di, bd = Infinity;
    this._slots.forEach((s, i) => {
      const dd = (s.x - ev.clientX) * (s.x - ev.clientX) + (s.y - ev.clientY) * (s.y - ev.clientY);
      if (dd < bd) { bd = dd; best = i; }
    });
    this._tgt = best;
    const d = this.state.drag;
    if (!d) return;
    this.setState({ drag: Object.assign({}, d, { x: ev.clientX, y: ev.clientY, target: best }) });
  }

  endDrag() {
    if (!this._dragging) return;
    this._dragging = false;
    this.unbind();
    const order = this.state.order.slice();
    const from = this._di, to = this._tgt;
    if (to !== from) {
      const it = order.splice(from, 1)[0];
      order.splice(to, 0, it);
    }
    this.setState({ order: order, drag: null });
  }

  keyMove(e, k) {
    if (this.state.checked) return;
    let to = k;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") to = k - 1;
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") to = k + 1;
    else return;
    if (to < 0 || to > 3) return;
    if (e.preventDefault) e.preventDefault();
    const board = e.currentTarget.closest("[data-board]");
    const order = this.state.order.slice();
    const it = order.splice(k, 1)[0];
    order.splice(to, 0, it);
    this.setState({ order: order });
    setTimeout(() => {
      const cards = board && board.querySelectorAll("[data-card]");
      if (cards && cards[to]) cards[to].focus();
    }, 30);
  }

  check() {
    const st = this.state;
    if (st.checked) return;
    const hits = st.order.filter((id, k) => id === st.sorted[k]).length;
    this.setState({
      checked: true,
      guess: st.order.slice(),
      order: st.sorted.slice(),
      hits: hits,
      score: st.score + (hits === 4 ? 1 : 0),
      drag: null
    });
  }

  next() {
    if (this.state.round >= 4) {
      this.setState({ phase: "final" });
    } else {
      this.setState(Object.assign({ round: this.state.round + 1 }, this.freshRound()));
    }
  }

  again() {
    this.setState(this.freshGame());
  }

  renderVals() {
    const st = this.state;
    const ev = this.events();
    const d = st.drag;
    const slots = st.order.map((id, k) => {
      const e = ev[id];
      const dragging = !!d && d.i === k;
      const target = !!d && d.target === k && d.target !== d.i;
      const ok = st.checked ? st.guess.indexOf(id) === k : false;
      const flags = {};
      for (let n = 0; n < ev.length; n++) flags["a" + n] = n === id;
      return Object.assign({
        num: "0" + (k + 1),
        pos: k + 1,
        dragging: dragging,
        z: dragging ? 30 : 1,
        tf: dragging ? "translate(" + (d.x - d.sx) + "px," + (d.y - d.sy) + "px) rotate(-2deg)" : "none",
        cardShadow: dragging ? "12px 14px 0 #17212B" : "5px 5px 0 #17212B",
        cursor: st.checked ? "default" : (dragging ? "grabbing" : "grab"),
        anim: st.checked ? (ok ? "cardpop 0.75s cubic-bezier(.2,1.5,.4,1) " + (k * 0.08).toFixed(2) + "s both" : "cardshake 0.6s ease " + (k * 0.05).toFixed(2) + "s both") : "none",
        cardBorder: st.checked ? (ok ? "#1F6B69" : "#B8321F") : "#17212B",
        zoneBorder: target ? "#17212B" : "#B9B3A4",
        zoneBg: target ? "#E4A93B" : "transparent",
        title: e.title,
        year: e.year,
        fact: e.fact,
        reveal: st.checked,
        status: ok ? "Орнында" : "Орнында емес",
        statusBg: ok ? "#1F6B69" : "#B8321F",
        label: st.checked
          ? e.year + ". " + e.title
          : e.title + ". Орны " + (k + 1) + " / 4. Карточканы көрсеткілермен солға не оңға жылжытыңыз.",
        down: (evt) => this.startDrag(evt, k),
        key: (evt) => this.keyMove(evt, k)
      }, flags);
    });
    const perfect = st.hits === 4;
    const pal = ["#D2402F", "#E4A93B", "#2B7A78", "#17212B", "#7FB8DA"];
    const confetti = [], rain = [], sparks = [], drops = [];
    for (let n = 0; n < 44; n++) {
      const ang = (n / 44) * Math.PI * 2 + (n % 3) * 0.2, dist = 160 + (n * 37 % 200);
      confetti.push({ bg: pal[n % 5], dx: Math.round(Math.cos(ang) * dist * 1.4) + "px", dy: Math.round(Math.sin(ang) * dist - 60) + "px", rot: (n * 53 % 720 - 360) + "deg", delay: ((n % 6) * 0.03).toFixed(2) + "s" });
    }
    for (let n = 0; n < 48; n++) {
      rain.push({ left: ((n * 2.1 + (n % 5)) % 100).toFixed(1) + "%", bg: pal[n % 5], sx: (n % 7 * 14 - 40) + "px", rot: (n * 71 % 720) + "deg", dur: (4 + (n % 5) * 0.7).toFixed(1) + "s", delay: "-" + ((n * 0.37) % 5).toFixed(2) + "s" });
    }
    const fw = [["22%", "30%"], ["72%", "22%"], ["50%", "52%"]];
    for (let f = 0; f < 3; f++) for (let n = 0; n < 14; n++) sparks.push({ x: fw[f][0], y: fw[f][1], bg: pal[(n + f) % 4], a: Math.round(n * 360 / 14) + "deg", delay: (f * 0.6).toFixed(1) + "s" });
    for (let n = 0; n < 26; n++) drops.push({ left: ((n * 4.1) % 100).toFixed(1) + "%", delay: "-" + ((n * 0.29) % 1.1).toFixed(2) + "s", dur: (0.9 + (n % 4) * 0.15).toFixed(2) + "s" });
    const fin = st.phase === "final";
    const cols = ["#D2402F", "#E4A93B", "#2B7A78", "#17212B"];
    const pennants = [];
    for (let n = 0; n < 18; n++) pennants.push({ bg: cols[n % 4], delay: "-" + (n * 0.37).toFixed(2) + "s" });
    return {
      isPlay: st.phase === "play",
      isFinal: st.phase === "final",
      showBurst: st.phase === "play" && st.checked && perfect,
      final5: fin && st.score === 5,
      final0: fin && st.score === 0,
      confetti: confetti, rain: rain, sparks: sparks, drops: drops,
      finalAnim: !fin ? "none" : (st.score === 5 ? "scorepop 0.8s cubic-bezier(.2,1.4,.4,1) both, pulse 1.6s ease-in-out 0.9s infinite" : (st.score === 0 ? "scorepop 0.8s ease both, droop 3s ease-in-out 0.9s infinite" : "scorepop 0.8s cubic-bezier(.2,1.4,.4,1) both")),
      finalColor: fin && st.score === 0 ? "#6E7C89" : "#D2402F",
      roundLabel: st.phase === "final" ? "Қорытынды" : "Раунд " + (st.round + 1) + " / 5",
      scoreLabel: "Ұпай " + st.score,
      ticks: [0, 1, 2, 3, 4].map((n) => ({
        bg: st.phase === "final" || n < st.round ? "#17212B" : (n === st.round ? "#D2402F" : "#D6D0C0")
      })),
      slots: slots,
      pennants: pennants,
      showCheck: !st.checked,
      showNext: st.checked,
      nextLabel: st.round >= 4 ? "Нәтиже" : "Әрі қарай",
      verdict: perfect ? "Бәрі дұрыс" : "Орнында: " + st.hits + " / 4",
      verdictColor: perfect ? "#1F6B69" : "#B8321F",
      check: () => this.check(),
      next: () => this.next(),
      again: () => this.again(),
      finalScore: st.score,
      roundsTotal: 5,
      finalText: st.score === 0
        ? "Ештеңе етпейді! Қайта ойнап көріңіз, келесі жолы міндетті түрде шығады."
        : st.score === 5
        ? "Мінсіз! Сіз Қонаев дәуірін жақсы білесіз."
        : (st.score >= 3
          ? "Жақсы нәтиже. Қайта ойнаңыз, оқиғалар басқаша түседі."
          : "Дәуір оқиғаға толы болды. Қайта ойнаңыз: оқиғалар әр жолы басқаша түседі.")
    };
  }
}


(function(){
  var tpl=document.getElementById('tpl').content, root=document.getElementById('root');
  var comp, handlers=[];
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function get(path,scope){var v=scope;var ps=path.trim().split('.');for(var i=0;i<ps.length;i++){if(v==null)return undefined;v=v[ps[i]];}return v;}
  function whole(s){var m=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(s);return m?m[1]:null;}
  function interp(s,scope){return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(_,e){var v=get(e,scope);return v==null||v===false?'':String(v);});}
  var VOID={img:1,br:1,hr:1,input:1,link:1,meta:1};
  function r(n,scope){
    if(n.nodeType===3)return esc(interp(n.data,scope));
    if(n.nodeType!==1)return '';
    var t=n.localName;
    if(t==='sc-for'){
      var list=get(whole(n.getAttribute('list')),scope)||[],as=n.getAttribute('as'),o='';
